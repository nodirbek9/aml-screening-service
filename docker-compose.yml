version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: aml_postgres
    environment:
      POSTGRES_DB: aml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: aml_app
    ports:
      - "7777:7777"
    environment:
      PORT: 7777
      DATABASE_URL: jdbc:postgresql://postgres:5432/aml
      DB_USERNAME: postgres
      DB_PASSWORD: 1111
      # Local-only dev secret. Generate your own with: openssl rand -hex 64
      # Override in production via fly secrets / Koyeb env vars.
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-replace-me-with-openssl-rand-hex-64}
      SCREENING_THRESHOLD: "0.80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
