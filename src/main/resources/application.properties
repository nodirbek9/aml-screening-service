spring.application.name=aml-diploma-project

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
# PORT is the convention used by Fly.io / Koyeb / Render / Heroku.
# Falls back to 7777 for local development.
server.port=${PORT:7777}

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------
# In production set DATABASE_URL (e.g. Fly Postgres / Neon / Supabase).
# Locally you can omit all DB_* env vars and the defaults will be used.
spring.sql.init.platform=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aml}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1111}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# IMPORTANT: override JWT_SECRET in every deployed environment.
# Generate a strong one with:  openssl rand -hex 64
jwt.token.secret=${JWT_SECRET:change-me-in-production-please-use-openssl-rand-hex-64}

# -----------------------------------------------------------------------------
# Screening
# -----------------------------------------------------------------------------
# Match threshold (0.0 - 1.0). Higher = stricter, fewer false positives.
screening.threshold=${SCREENING_THRESHOLD:0.80}
